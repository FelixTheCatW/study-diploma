[project]
name = "diploma-food-behavior"
version = "0.1.0"
description = "Загрузка, анализ и подготовка данных DietDiary + USDA для дипломного проекта"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["data", ".venv", "tests/.pytest_tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
